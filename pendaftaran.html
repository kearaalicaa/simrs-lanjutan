<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a class="active" href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a href="radiologi.html">Radiologi</a>
        <a href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>

    <div class="main">

        <div class="card">
            <h2>Form Pendaftaran</h2>
            <input type="text" id="NamaPasien" placeholder="Nama Pasien">
            <select id="PilihanPoli">
                <option>Poli Umum</option>
                <option>Poli Gigi</option>
                <option>Poli Dalam</option>
            </select>

            <button id="submit" class="btn-simpan" onclick="submitRegister()">Simpan</button>
        </div>

        <script>
            let pasien = []

            let indexUpdate = -1

            function submitRegister() {
                let NamaPasien = document.getElementById("NamaPasien").value.trim()
                let PilihanPoli = document.getElementById("PilihanPoli").value

                if (NamaPasien === "") {
                    alert("Nama Pasien wajib diisi")
                    return
                }
                if (indexUpdate !== -1) {
                    pasien[indexUpdate] = {
                        nama: NamaPasien,
                        poli: PilihanPoli
                    }

                    document.getElementById("submit").innerText = "simpan"
                    alert("Pasien berhasil diupdate")
                    indexUpdate = -1

                } else {
                    pasien.push({
                        nama: NamaPasien,
                        poli: PilihanPoli
                    })
                    alert("Pasien berhasil disimpan")
                }

                renderTable()
                document.getElementById("NamaPasien").value = ""
                document.getElementById("PilihanPoli").selectedIndex = 0
            }

            function renderTable() {
                let html = ""
                pasien.forEach((item, index) => {
                    html += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${item.nama}</td>
                    <td>${item.poli}</td>
                    <td><span class="badge wait">Menunggu</span></td>
                    <td>
                        <button onclick="updateRegister(${index})">Update</button>
                        <button onclick="deleteRegister(${index})">Delete</button>
                    </td>
                </tr>
                `
                })
                document.getElementById("tpasien").innerHTML = html
            }

            function deleteRegister(index) {
                let konfirmasi =
                    confirm(`Yakin ingin hapus pasien ${pasien[index].nama}?`)

                if (konfirmasi) {
                    pasien.splice(index, 1)
                    renderTable()
                    alert("Pasien berhasil dihapus")
                }
            }

            function updateRegister(index) {
                document.getElementById("submit").innerText = "Update"
                document.getElementById("NamaPasien").value = pasien[index].nama
                document.getElementById("PilihanPoli").value = pasien[index].poli
                indexUpdate = index
            }
        </script>

        <div class="card">
            <h2>List Pendaftaran</h2>
            <table>
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>Poli</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>

                <tbody id="tpasien"></tbody>
            </table>
        </div>

    </div>
</body>

</html>
