<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a href="radiologi.html">Radiologi</a>
        <a class="active" href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>
    <div class="main">

        <div class="card">
            <h2>Pembayaran</h2>
            <input id="NamaPasien" placeholder="Nama Pasien">
            <input id="Total" placeholder="Total">
            <button id="btnSubmit" onclick="submitKasir()">Bayar</button>
        </div>

        <script>
            let kasir = []
            let indexUpdate = -1

            function submitKasir() {
                let NamaPasien = document.getElementById("NamaPasien").value.trim()
                let Total = document.getElementById("Total").value

                if (NamaPasien === "") {
                    alert("Nama Pasien wajib diisi")
                    return
                } else if (Total === "") {
                    alert("Total pembayaran wajib diisi")
                    return
                }
                if (indexUpdate !== -1) {
                    kasir[indexUpdate] = {
                        nama: NamaPasien,
                        total: Total,
                        status: kasir[indexUpdate].status
                    }

                    document.getElementById("btnSubmit").innerText = "simpan"
                    alert("Pasien berhasil diupdate")
                    indexUpdate = -1

                } else {
                    kasir.push({
                        nama: NamaPasien,
                        total: Total,
                        status: "Menunggu"
                    })
                    alert("Transaksi berhasil disimmpan")
                }

                renderTable()
                document.getElementById("NamaPasien").value = ""
                document.getElementById("Total").value = ""
            }

            function renderTable() {
                let html = ""
                kasir.forEach((item, index) => {
                    html += `
                <tr>
                    <td>${item.nama}</td>
                    <td>${item.total}</td>
                    <td>${item.status}</td>
                    <td>
                        <button onclick="updateKasir(${index})">Update</button>
                        <button onclick="deleteKasir(${index})">Delete</button>
                    </td>
                </tr>
                `
                })
                document.getElementById("tkasir").innerHTML = html
            }

            function deleteKasir(index) {
                let konfirmasi =
                    confirm(`Yakin ingin hapus pasien ${kasir[index].nama}?`)

                if (konfirmasi) {
                    kasir.splice(index, 1)
                    renderTable()
                    alert("Pasien berhasil dihapus")
                }
            }

            function updateKasir(index) {
                document.getElementById("btnSubmit").innerText = "Update"
                document.getElementById("NamaPasien").value = kasir[index].nama
                document.getElementById("Total").value = kasir[index].total
                indexUpdate = index
            }
        </script>

        <div class="card">
            <h2>Riwayat Transaksi</h2>
            <table>
                <tr>
                    <th>Pasien</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Aksi</th>
                </tr>
                <tbody id="tkasir"></tbody>
            </table>
        </div>

    </div>
</body>

</html>
