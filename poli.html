<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a class="active" href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a href="radiologi.html">Radiologi</a>
        <a href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>
    <div class="main">

        <div class="card">
            <h2>Pemeriksaan Poli</h2>
            <input id="NamaPasien" placeholder="Nama Pasien">
            <input id="Diagnosa" placeholder="Diagnosa">
            <input id="Tindakan" placeholder="Tindakan">
            <button id="submit" class="btn-simpan" onclick="submitPemeriksaan()">Simpan Pemeriksaan</button>
        </div>


        <div class="card">
            <h2>Antrian Poli</h2>
            <table>
                <tr>
                    <th>No</th>
                    <th>Nama Pasien</th>
                    <th>Diagnosa</th>
                    <th>Tindakan</th>
                    <th>Aksi</th>
                </tr>
                <tbody id="tpoli"></tbody>
            </table>
        </div>

    </div>
    <script>
        let pemeriksaan = localStorage.getItem("pemeriksaan") ? JSON.parse(localStorage.getItem("pemeriksaan")) : []
        let indexUpdate = -1
        console.log(pemeriksaan)


        function submitPemeriksaan() {
            let NamaPasien = document.getElementById("NamaPasien").value.trim()
            let Diagnosa = document.getElementById("Diagnosa").value.trim()
            let Tindakan = document.getElementById("Tindakan").value.trim()

            if (!NamaPasien) {
                alert("Nama Pasien wajib diisi")
            } else if (!Diagnosa) {
                alert("Diagnosa wajib diisi")
            } else if (!Tindakan) {
                alert("Tindakan wajib diisi")
            } else {
                if (indexUpdate !== -1) {
                    pemeriksaan[indexUpdate] = {
                        nama: NamaPasien,
                        diagnosa: Diagnosa,
                        tindakan: Tindakan,
                    }

                    localStorage.setItem("pemeriksaan", JSON.stringify(pemeriksaan))
                    document.getElementById("submit").innerText = "Simpan Pemeriksaan"
                    alert("Data pemeriksaan berhasil diupdate")
                    indexUpdate = -1


                } else {
                    pemeriksaan.push({
                        nama: NamaPasien,
                        diagnosa: Diagnosa,
                        tindakan: Tindakan
                    })
                    alert("Data pemeriksaan berhasil disimpan")
                }

                localStorage.setItem("pemeriksaan", JSON.stringify(pemeriksaan))

                renderTable()
                document.getElementById("NamaPasien").value = ""
                document.getElementById("Diagnosa").value = ""
                document.getElementById("Tindakan").value = ""
            }
        }

        function renderTable() {
            let html = ""
            pemeriksaan.forEach((item, index) => {
                html += `
            <tr>
                <td>${index + 1}</td>
                <td>${item.nama}</td>
                <td>${item.diagnosa}</td>
                <td>${item.tindakan}</td>
                <td>
                    <button onclick="updatePemeriksaan(${index})">Update</button>
                    <button onclick="deletePemeriksaan(${index})">Delete</button>
                </td>
            </tr>
            `
            })
            document.getElementById("tpoli").innerHTML = html
        }

        function deletePemeriksaan(index) {
            let konfirmasi =
                confirm(`Yakin ingin menghapus data ${pemeriksaan[index].nama}?`)
            if (konfirmasi) {
                pemeriksaan.splice(index, 1)
                localStorage.setItem("pemeriksaan", JSON.stringify(pemeriksaan))
                renderTable()
                alert("Data berhasil dihapus")
            }
        }

        function updatePemeriksaan(index) {
            document.getElementById("NamaPasien").value = pemeriksaan[index].nama
            document.getElementById("Diagnosa").value = pemeriksaan[index].diagnosa
            document.getElementById("Tindakan").value = pemeriksaan[index].tindakan
            document.getElementById("submit").innerText = "Update Pemeriksaan"

            indexUpdate = index
        }

        renderTable()
    </script>
</body>

</html>
