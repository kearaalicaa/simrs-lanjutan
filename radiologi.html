<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMKES</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div class="sidebar">
        <h2>SIMKES</h2>
        <a href="index.html">Dashboard</a>
        <a href="pendaftaran.html">Pendaftaran</a>
        <a href="poli.html">Pemeriksaan Poli</a>
        <a href="farmasi.html">Farmasi</a>
        <a href="laboratorium.html">Laboratorium</a>
        <a class="active" href="radiologi.html">Radiologi</a>
        <a href="kasir.html">Kasir</a>
        <a href="login.html">Logout</a>
    </div>
    <div class="main">
        <div class="card">
            <h2>Radiologi</h2>
            <input id="NamaPasien" placeholder="Nama Pasien">
            <select id="Pemeriksaan">
                <option>X-Ray</option>
                <option>CT Scan</option>
                <option>MRI</option>
                <option>USG</option>
            </select>
            <input id="Hasil" placeholder="Hasil Radiologi">
            <button id="btnSubmit" onclick="submitRadiologi()">Simpan Hasil</button>
        </div>

        <script>
            let radiologi = []
            let indexUpdate = -1

            function submitRadiologi() {
                let NamaPasien = document.getElementById("NamaPasien").value.trim()
                let Pemeriksaan = document.getElementById("Pemeriksaan").value.trim()
                let Hasil = document.getElementById("Hasil").value.trim()

                if (!NamaPasien) {
                    alert("Nama pasien wajib di isi")
                } else if (!Hasil) {
                    alert("Hasil radiologi harus diisi")

                } else if (indexUpdate !== -1) {
                    radiologi[indexUpdate] = {
                        nama: NamaPasien,
                        pemeriksaan: Pemeriksaan,
                        hasil: Hasil
                    }

                    alert("Data radiologi berhasil diupdate")

                    indexUpdate = -1
                    document.getElementById("btnSubmit").innerText = "Simpan Hasil"

                    renderTable()
                    document.getElementById("NamaPasien").value = ""
                    document.getElementById("Pemeriksaan").selectedIndex = 0
                    document.getElementById("Hasil").value = ""

                } else {
                    radiologi.push({
                        nama: NamaPasien,
                        pemeriksaan: Pemeriksaan,
                        hasil: Hasil,
                    })

                    alert("Data radiologi berhasil disimpan")


                    renderTable()
                    document.getElementById("NamaPasien").value = ""
                    document.getElementById("Pemeriksaan").selectedIndex = 0
                    document.getElementById("Hasil").value = ""
                }
            }

            function renderTable() {
                let html = ""
                radiologi.forEach((item, index) => {
                    html += `
                <tr>
                    <td>${item.nama}</td>
                    <td>${item.pemeriksaan}</td>
                    <td>${item.hasil}</td>
                    <td>
                        <button onclick="updateRadiologi(${index})">Update</button>
                        <button onclick="deleteRadiologi(${index})">Delete</button>
                    </td>
                </tr>
                `
                })
                document.getElementById("tradiologi").innerHTML = html
            }

            function deleteRadiologi(index) {
                let konfirmasi = confirm(
                    `Yakin ingin menghapus data ${radiologi[index].nama}?`
                );

                if (konfirmasi) {
                    radiologi.splice(index, 1);
                    renderTable();
                    alert("Data berhasil dihapus");
                }
            }

            function updateRadiologi(index) {
                document.getElementById("NamaPasien").value = radiologi[index].nama
                document.getElementById("Pemeriksaan").value = radiologi[index].pemeriksaan;
                document.getElementById("Hasil").value = radiologi[index].hasil;
                document.getElementById("btnSubmit").innerText = "Update Hasil";

                indexUpdate = index;
            }

            renderTable();
        </script>

        <div class="card">
            <h2>Data Radiologi</h2>
            <table>
                <tr>
                    <th>Pasien</th>
                    <th>Pemeriksaan</th>
                    <th>Hasil</th>
                    <th>Aksi</th>
                </tr>
                <tbody id="tradiologi"></tbody>
            </table>
        </div>

    </div>
</body>

</html>
